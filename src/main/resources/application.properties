spring.application.name=backend-iglesiarioseco
# ===============================
# CONEXIÓN A POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:9009/iglesia_rioseco_db
spring.datasource.username=postgres
spring.datasource.password=912130624
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Lo ponemos en 'none' porque nosotros ya creamos las tablas, la herencia y los triggers manualmente en pgAdmin.
# Si usamos 'update' o 'create', Spring Boot intentará sobrescribir tu trabajo y arruinará la auditoría.
spring.jpa.hibernate.ddl-auto=none

# Para ver las consultas SQL en la consola (útil para desarrollo)
spring.jpa.show-sql=true